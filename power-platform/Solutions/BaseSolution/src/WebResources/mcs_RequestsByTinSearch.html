    <script>

        function hashReadyNotification() {

        function setClientApiContext(xrm, formContext) {
            window._formContext = formContext;
            CommCare.Shared.FormContext = _formContext;
            console.log("context from setClientApiContext: " + !!formContext);
            initiateAppInsights();
            onLoad();
        }

        function initiateAppInsights() {
            var globalContext = Xrm.Utility.getGlobalContext();
            var serverUrl = globalContext.getClientUrl();
            var orgSplit = serverUrl.split("-");
            var org;
            var columns = "mcs_appinsights_key";
            var filter = null;

            CommCare.Shared.CrmCommonJS.WebApi.RetrieveMultiple("mcs_settings", columns, filter).then(function (dataResponse) {
                var data = dataResponse.value;
                if (data.length > 0) {
                    key = data[0].mcs_appinsights_key;

                    //const prodKey = "c34a20fe-8922-f9c6-9ad9-687640ddad8c";
                    //const nProdKey = "b2d1a0fa-af2a-f5ae-85d9-45abcee3b458";
                    //const devKey = "1b396e0c-ec4f-ffa9-9fa3-8cb1bbd1fddd";

                    //var key;
                    if (orgSplit.length < 3) {
                        //key = prodKey;
                        org = "PROD"
                    }
                    else {
                        orgSplit = orgSplit[2].split(".")[0];
                        //key = orgSplit == "dev" ? devKey : nProdKey;
                        org = orgSplit.toUpperCase();
                    }

                    var appInsights = window.appInsights || function (a) {
                        function b(a) { c[a] = function () { var b = arguments; c.queue.push(function () { c[a].apply(c, b) }) } } var c = { config: a }, d = document, e = window; setTimeout(function () { var b = d.createElement("script"); b.src = a.url || "https://az416426.vo.msecnd.net/scripts/a/ai.0.js", d.getElementsByTagName("script")[0].parentNode.appendChild(b) }); try { c.cookie = d.cookie } catch (a) { } c.queue = []; for (var f = ["Event", "Exception", "Metric", "PageView", "Trace", "Dependency"]; f.length;) b("track" + f.pop()); if (b("setAuthenticatedUserContext"), b("clearAuthenticatedUserContext"), b("startTrackEvent"), b("stopTrackEvent"), b("startTrackPage"), b("stopTrackPage"), b("flush"), !a.disableExceptionTracking) { f = "onerror", b("_" + f); var g = e[f]; e[f] = function (a, b, d, e, h) { var i = g && g(a, b, d, e, h); return !0 !== i && c["_" + f](a, b, d, e, h), i } } return c
                    }({
                        instrumentationKey: key,
                        endpointUrl: "https://dc.applicationinsights.us/v2/track"
                    });

                    var UserName;
                    var Alias;
                    var UserID;
                    var formName;
                    var entityName;
                    var selectFields = "$select=DomainName,FullName";


                    UserID = globalContext.userSettings.userId.replace("{", "").replace("}", "").toLowerCase();
                    eventName = "TIN_Search";

                    window.appInsights = appInsights, appInsights.queue
                        && 0 === appInsights.queue.length
                        && appInsights.trackPageView(eventName, serverUrl,
                            {
                                User: globalContext.userSettings.userName
                                , AgentId: UserID
                                , DomainName: "CommCare"
                                , Organization: org
                                , SessionId: uuidv4()
                            });
                }
            });
        }

        

        function uuidv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
