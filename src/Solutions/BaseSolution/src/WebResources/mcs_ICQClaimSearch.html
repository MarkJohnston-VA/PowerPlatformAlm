                        //key = orgSplit == "dev" ? devKey : nProdKey;

                    var appInsights = window.appInsights || function (a) {

                    var UserName;

        function uuidv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);

    <script>
        $(document).ready(function () {
            console.log("in start");
            //debugger;
            onLoad();
            $("#claimNumber").on("keyup", function (e) {
                if (e.keyCode === 13 || e.keyCode === 32) {
                    searchData(1);
                }
                else {
                    var value = $(this).val().toLowerCase();
                    $("#table tr").not("thead tr").filter(function () {
                        $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1 && $(this).attr("data-group") == 1)
                    });
                }
            });
            $("#PDI").on("keyup", function (e) {
                if (e.keyCode === 13 || e.keyCode === 32) {
                    searchData(1);
                }
                else {
                    var value = $(this).val().toLowerCase();
                    $("#table tr").not("thead tr").filter(function () {
                        $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1 && $(this).attr("data-group") == 1)
                    });

                }
            });
            $("#startDate").on("keyup", function (e) {
                if (e.keyCode === 13 || e.keyCode === 32) {

            });
            $("#endDate").on("keyup", function (e) {
                if (e.keyCode === 13 || e.keyCode === 32) {
                    searchData(1);
                }
            });
        });
