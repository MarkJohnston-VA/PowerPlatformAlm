<html>
<head>
    <script src="vhacrm_/scripts/Common/CommCareShared.min.js"></script>
    <script src="bah_jquery_3_2_1.js" type="text/javascript"></script>
    <style type="text/css">
        html,
        body {
            height: 100%;
            overflow: auto;
            border-width: 0px;
        }

        body {
            padding: 0;
            margin: 0;
        }

        .pure-button {
            /* Structure */
            display: inline-block;
            zoom: 1;
            line-height: normal;
            white-space: nowrap;
            vertical-align: middle;
            text-align: center;
            cursor: pointer;
            -webkit-user-drag: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Arial;
            font-size: 100%;
            padding: 0.5em 1em;
            color: #444; /* rgba not supported (IE 8) */
            color: rgba(0, 0, 0, 0.80); /* rgba supported */
            border: 1px solid #999; /*IE 6/7/8*/
            border: none rgba(0, 0, 0, 0); /*IE9 + everything else*/
            background-color: #E6E6E6;
            text-decoration: none;
            border-radius: 2px;
        }

            /* Firefox: Get rid of the inner focus border */
            .pure-button::-moz-focus-inner {
                padding: 0;
                border: 0;
            }

            .pure-button-hover,
            .pure-button:hover,
            .pure-button:focus {
                filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#00000000', endColorstr='#1a000000',GradientType=0);
                background-image: -webkit-gradient(linear, 0 0, 0 100%, from(transparent), color-stop(40%, rgba(0,0,0, 0.05)), to(rgba(0,0,0, 0.10)));
                background-image: -webkit-linear-gradient(transparent, rgba(0,0,0, 0.05) 40%, rgba(0,0,0, 0.10));
                background-image: -moz-linear-gradient(top, rgba(0,0,0, 0.05) 0%, rgba(0,0,0, 0.10));
                background-image: -o-linear-gradient(transparent, rgba(0,0,0, 0.05) 40%, rgba(0,0,0, 0.10));
                background-image: linear-gradient(transparent, rgba(0,0,0, 0.05) 40%, rgba(0,0,0, 0.10));
            }

            .pure-button:focus {
                outline: 0;
            }

            .pure-button-active,
            .pure-button:active {
                box-shadow: 0 0 0 1px rgba(0,0,0, 0.15) inset, 0 0 6px rgba(0,0,0, 0.20) inset;
                border-color: #000\9;
            }

            .pure-button[disabled],
            .pure-button-disabled,
            .pure-button-disabled:hover,
            .pure-button-disabled:focus,
            .pure-button-disabled:active {
                border: none;
                background-image: none;
                filter: progid:DXImageTransform.Microsoft.gradient(enabled = false);
                filter: alpha(opacity=40);
                -khtml-opacity: 0.40;
                -moz-opacity: 0.40;
                opacity: 0.40;
                cursor: not-allowed;
                box-shadow: none;
            }

        .pure-button-hidden {
            display: none;
        }

        /* Firefox: Get rid of the inner focus border */
        .pure-button::-moz-focus-inner {
            padding: 0;
            border: 0;
        }

        .pure-button-primary,
        .pure-button-selected,
        a.pure-button-primary,
        a.pure-button-selected {
            background-color: rgb(0, 120, 231);
            color: #fff;
        }

        .button-success,
        .button-error,
        .button-warning,
        .button-secondary {
            color: white;
            border-radius: 4px;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
        }

        .button-secondary {
            background: rgb(66, 184, 221); /* this is a light blue */
        }
    </style>
    <script type="text/javascript">
        $(document).ready(function () {
            //hashReadyNotification();
        });

        function hashReadyNotification() {
            window.location.hash = "ReadyXrm";
        }

        function setClientApiContext(xrm, formContext) {
            window.Xrm = xrm;
            window._formContext = formContext;
            CommCare.Shared.FormContext = _formContext;
            console.log("sendemailbutton has context");
            var sent = CommCare.Shared.GetFieldValue("vhacrm_correspondenceemailcheck_bool");

            if (sent == true) {
                $('#button').html("Email Sent");
                $("#button").attr("disabled", true);
            }

        }

        function SendEmail() {
            var email = CommCare.Shared.GetFieldValue("ccwf_email_text");
            var emailAlreadySent = CommCare.Shared.GetFieldValue("vhacrm_correspondenceemailcheck_bool");
            var recordId = CommCare.Shared.FormContext.data.entity.getId().replace("{", "").replace("}", "").toLowerCase();
            var entity = {};

            $("#button").attr("disabled", true);

            if (email != null && validateEmail(email) == true) {
                if (emailAlreadySent != true) {
                    CommCare.Shared.FormContext.data.save().then(function () {
                        CommCare.Shared.CallEntityAction("mcs_RequestSendCorrespondenceEmailandCreateCorrespondenceRecord", "incident", recordId, entity).then(function (result) {
                            console.log("Successful Email Send");
                            CommCare.Shared.SetFieldValue("vhacrm_correspondenceemailcheck_bool", true);
                            $("#button").html("Email Sent");
                            alert("Your email has been sent");
                        });
                    });
                }
                else {
                    alert("An email has already been sent");
                }
            }
            else {
                alert("Invalid email address")
                $("#button").attr("disabled", false);
            }
        }

        function validateEmail(email) {
            var regex = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
            if (email.match(regex)) {
                return true;
            }
            else {
                return false;
            }
        }
    </script>
</head>
<body>
    <button onclick="SendEmail()" type="button" id="button" class="pure-button button-secondary">Send Email</button>
</body>
</html>
