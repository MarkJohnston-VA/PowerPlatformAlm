<html>
<head>
    <title>FMP Claim Report</title>
    <script src="bah_jquery_3_2_1.js" type="text/javascript"></script>
    <script src="vhacrm_/scripts/Common/CommCareShared.min.js"></script>
    <script type="text/javascript" src="mcs_FMPClaimSummaryReport.js"></script>
    <meta charset="utf-8">
</head>

<body bgcolor="#f6f8fa" onfocusout="parent.setEmailRange();" style="overflow-wrap: break-word;">
    <script>
        $(document).ready(function () {
            //hashReadyNotification();
        });

        function hashReadyNotification() {
            window.location.hash = "ReadyXrm";
        }

        function setClientApiContext(xrm, formContext) {
            window.Xrm = xrm;
            window._formContext = formContext;
            if (!CommCare.Shared.FormContext) CommCare.Shared.FormContext = formContext;
            console.log("fmpclaimsummaryreport has context");
            setEobValue();
        }

        function setEobValue() {
            try {
                var rpt = CommCare.Shared.GetFieldValue("mcs_textofreport");
                DisplayReport(rpt);
            } catch (e) {
                return;
            }
        }

    </script>
    <pre id="divReport" class="divReport"> </pre>
</body>
</html>
