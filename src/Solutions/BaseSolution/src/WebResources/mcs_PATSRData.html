<!DOCTYPE html>
<html>
<head>
    <script src="vhacrm_/scripts/Common/CommCareShared.min.js"></script>
    <meta charset="utf-8">
    <title></title>
    <style type="text/css">
        html {
            overflow: auto;
        }

        html,
        body,
        div,
        iframe {
            margin: 0px;
            padding: 0px;
            height: 100%;
            border: none;
        }

        iframe {
            display: block;
            width: 100%;
            border: none;
            overflow-y: auto;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <iframe id="canvasApp" src="" frameborder="0" marginheight="0" marginwidth="0" width="100%" height="100%" scrolling="auto"></iframe>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            hashReadyNotification();
        });

        function hashReadyNotification() {
            window.location.hash = "ReadyXrm";
        }

        function setClientApiContext(xrm, formContext) {
            window.Xrm = xrm;
            window._formContext = formContext;
            try {
                var url = "https://apps.gov.powerapps.us/play/ed47ab8f-dfc0-4625-a6ee-183cca091d83?tenantId=e95f1b23-abaf-45ee-821d-b7ab251ab3bf";
                console.log(!!_formContext);
                var ssn = _formContext.getAttribute("bah_ssn_text").getValue();
                var dob = _formContext.getAttribute("bah_dob_date").getValue();
                var fName = _formContext.getAttribute("firstname").getValue();
                var lName = _formContext.getAttribute("lastname").getValue();
                url += "&SSN=" + ssn + "&DOB=" + dob + "&fName=" + fName + "&lName=" + lName;
                document.getElementById("canvasApp").src = url;
            }
            catch (ex) {
                console.log(ex);
            }
        }
    </script>
</body>
</html>
