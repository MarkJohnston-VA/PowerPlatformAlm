Screen1 As screen:
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)

    Container1 As groupContainer.horizontalAutoLayoutContainer:
        Height: =768
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =15
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =25
        PaddingLeft: =5
        PaddingRight: =5
        PaddingTop: =5
        Width: =1366
        ZIndex: =7

        Label1 As Label:
            DisplayMode: =DisplayMode.Edit
            FontSize: =10.5
            Height: =32
            LayoutMinHeight: =32
            LayoutMinWidth: =320
            Text: |-
                ="Add to the following User:"
            Width: =320
            X: =53
            Y: =67
            ZIndex: =1

        "ComboBox1 As 'Combo box'.pcfdataset":
            DisplayMode: =DisplayMode.Edit
            Height: =32
            Items: |-
                =Filter(
                    Users,
                    systemuserid in LookUp(
                        Queues,
                        Name = Label2.Text
                    ).'Users (queuemembership_association)'.systemuserid
                )
            LayoutMinHeight: =32
            LayoutMinWidth: =320
            Width: =320
            X: =53
            Y: =111
            ZIndex: =2

            "'Full Name1' As pcfDataField.textualColumn":
                FieldDisplayName: ="Full Name"
                FieldName: ="fullname"
                FieldType: ="s"
                FieldVariantName: ="textualColumn"
                Order: =1
                ZIndex: =1

            "'User Name1' As pcfDataField.textualColumn":
                FieldDisplayName: ="User Name"
                FieldName: ="domainname"
                FieldType: ="s"
                FieldVariantName: ="textualColumn"
                Order: =2
                ZIndex: =2

            "'Primary Email1' As pcfDataField.textualColumn":
                FieldDisplayName: ="Primary Email"
                FieldName: ="internalemailaddress"
                FieldType: ="s"
                FieldVariantName: ="textualColumn"
                Order: =3
                ZIndex: =3

            "'Business Unit1' As pcfDataField":
                FieldDisplayName: ="Business Unit"
                FieldName: ="businessunitid"
                FieldType: ="E"
                FieldVariantName: ="complexTypeColumn"
                Order: =4
                ZIndex: =4

            Title1 As pcfDataField.textualColumn:
                FieldDisplayName: ="Title"
                FieldName: ="title"
                FieldType: ="s"
                FieldVariantName: ="textualColumn"
                Order: =5
                ZIndex: =5

            Position1 As pcfDataField:
                FieldDisplayName: ="Position"
                FieldName: ="positionid"
                FieldType: ="E"
                FieldVariantName: ="complexTypeColumn"
                Order: =6
                ZIndex: =6

            "'Main Phone1' As pcfDataField.textualColumn":
                FieldDisplayName: ="Main Phone"
                FieldName: ="address1_telephone1"
                FieldType: ="s"
                FieldVariantName: ="textualColumn"
                Order: =7
                ZIndex: =7

        Container2 As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =50
            LayoutMinHeight: =50
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =3

            Container3 As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Width: =100
                ZIndex: =1

                Button1 As Button:
                    DisplayMode: =DisplayMode.Edit
                    FillColor: =ColorValue(AppTheme.palette.themePrimary)
                    Height: =32
                    LayoutMinHeight: =32
                    LayoutMinWidth: =96
                    OnSelect: |-
                        =IfError(
                            ForAll(
                                Gal_Accounts.AllItems,
                                Patch(
                                    'Queue Items',
                                    ThisRecord,
                                    {
                                        'Worked By': (ComboBox1.Selected)
                                    }
                                )
                            ),
                            Notify(FirstError.Message),
                            Notify(
                                "Records Routed",
                                NotificationType.Success
                            )
                        );
                        Navigate('Queue Items (Views)'.'Items Available to Work On')
                    Text: ="Route"
                    Width: =96
                    X: =53
                    Y: =170
                    ZIndex: =1

            Container4 As groupContainer.horizontalAutoLayoutContainer:
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                ZIndex: =2

                Button2 As Button:
                    BorderColor: =RGBA(149, 149, 149, 1)
                    BorderStyle: =BorderStyle.Solid
                    BorderThickness: =1
                    ButtonType: ='Microsoft.CoreControls.Button.ButtonType'.Primary
                    DisplayMode: =DisplayMode.Edit
                    FillColor: =RGBA(255, 255, 255, 1)
                    Height: =32
                    LayoutMinHeight: =32
                    LayoutMinWidth: =96
                    OnSelect: =Back()
                    PressedBorderColor: =RGBA(255, 255, 255, 1)
                    Text: ="Cancel"
                    TextColor: =RGBA(0, 0, 0, 1)
                    Width: =96
                    X: =0
                    Y: =0
                    ZIndex: =1

        Gal_Accounts As gallery.BrowseLayout_Vertical_ThreeTextVariant_pcfCore:
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderColor: =RGBA(166, 166, 166, 1)
            DelayItemLoading: =true
            FocusedBorderColor: =RGBA(0, 120, 212, 1)
            FocusedBorderThickness: =2
            Items: =VarQueueIds
            Layout: =Layout.Vertical
            LayoutMinHeight: =287
            LayoutMinWidth: =320
            LoadingSpinner: =LoadingSpinner.Data
            TemplatePadding: =0
            TemplateSize: =74
            ZIndex: =4

            Rectangle2 As rectangle:
                BorderColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(0,0,0,0)
                Fill: =RGBA(0,0,0,0)
                FocusedBorderColor: =RGBA(0, 120, 212, 1)
                Height: =Parent.TemplateHeight
                HoverFill: =RGBA(0,0,0,0)
                OnSelect: =Select(Parent)
                PressedFill: =RGBA(0,0,0,0)
                TabIndex: =0
                Width: =Parent.TemplateWidth
                ZIndex: =1

            Title3 As Label:
                DisplayMode: =DisplayMode.Edit
                FontSize: =10.5
                FontWeight: =FontWeight.Semibold
                Height: =24
                OnSelect: =Select(Parent)
                TabIndex: =-1
                Text: =ThisItem.'Actions, Progress, and Resolution'
                VerticalAlignment: =VerticalAlign.Top
                Width: =Parent.TemplateWidth - 24
                X: =12
                Y: =((Parent.TemplateHeight - 52) / 2) - 4
                ZIndex: =2

            Subtitle1 As Label:
                DisplayMode: =DisplayMode.Edit
                FontSize: =9
                FontWeight: =FontWeight.Normal
                Height: =24
                OnSelect: =Select(Parent)
                TabIndex: =-1
                Text: =ThisItem.'Brief Statement of Issue and Status'
                VerticalAlignment: =VerticalAlign.Top
                Width: =Title3.Width
                X: =Title3.X
                Y: =Title3.Y + Title3.Height - 6
                ZIndex: =3

            Body1 As Label:
                DisplayMode: =DisplayMode.Edit
                FontSize: =9
                FontWeight: =FontWeight.Normal
                Height: =24
                OnSelect: =Select(Parent)
                TabIndex: =-1
                Text: =ThisItem.Description
                VerticalAlignment: =VerticalAlign.Top
                Width: =Title3.Width
                X: =Title3.X
                Y: =50
                ZIndex: =4

        Label2 As Label:
            DisplayMode: =DisplayMode.Edit
            Height: =32
            LayoutMinHeight: =32
            LayoutMinWidth: =320
            Text: =Gal_Accounts.Selected.Queue.Name
            Width: =320
            X: =0
            Y: =0
            ZIndex: =5

